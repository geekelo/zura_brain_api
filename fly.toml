# fly.toml app configuration file generated for zura-brain-api on 2026-11-10T21:14:34+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'zura-brain-api'
primary_region = 'lhr'
console_command = '/rails/bin/rails console'

[build]
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
